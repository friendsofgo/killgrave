version: 2

builds:
  -
    binary: killgrave
    main: ./cmd/killgrave/main.go
    ldflags:
      - -s -w -X github.com/friendsofgo/killgrave/internal/app/cmd._version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - freebsd
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - 6
      - 7
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
archives:
  -
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
homebrew_casks:
  -
    name: killgrave
    homepage: https://github.com/friendsofgo/killgrave
    repository:
      owner: friendsofgo
      name: homebrew-tap
      token: "{{ .Env.GH_RELEASER }}"
    directory: Casks
    binaries:
      - killgrave
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/killgrave"]
          end
    description: |
      Simple way to generate fake servers
checksum:
  name_template: 'checksums.txt'
changelog:
  disable: true
